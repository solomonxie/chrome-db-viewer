<title>dbui App Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a Chrome window holding dbui as full-page tabs only (no popup, no side panel).
   "dbui · Home" is the start screen; each other browser tab is one connection or file,
   with sidebar tree | tabbed workspace | status bar inside, like a desktop DB client. */
:root {
  --bg: #e7ebef;
  --chrome: #dde3e9;
  --chrome-tab: #f6f8fa;
  --surface: #ffffff;
  --surface-2: #f3f6f8;
  --line: #d6dde3;
  --line-soft: #e8edf1;
  --fg: #16212b;
  --muted: #5c6b78;
  --faint: #8a97a3;
  --accent: #0b6e8a;
  --accent-soft: #dcf0f5;
  --accent-fg: #ffffff;
  --sel: #e3f1f6;
  --env-prod: #c4352b;
  --env-stage: #b7791f;
  --env-dev: #2f6fd6;
  --env-local: #6b7a87;
  --edit-bg: #fff3cf;
  --edit-fg: #7a5200;
  --add-bg: #e1f5e6;
  --add-fg: #1f6b35;
  --del-bg: #fde4e1;
  --del-fg: #a3271f;
  --kw: #8a3ab9;
  --str: #1f7a4d;
  --num: #b4540a;
  --bar: #3a8fa6;
  --bar-track: #e8edf1;
  --curcol: #eef6f9;
  --shadow: 0 10px 30px rgba(22, 33, 43, .14);
  --check-a: #ffffff;
  --check-b: #e2e7eb;
  --site-bg: #fbfaf7;
  --site-fg: #1d2a24;
  --site-muted: #5d6a63;
  --site-line: #e4e1d8;
  --site-link: #1a5fb4;
  --site-brand: #0f5c4a;
  --site-brand-fg: #ffffff;
  --native-bg: #0e0e0e;
  --native-fg: #b5b5b5;
  --video-bg: #000000;
  --font-ui: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --chrome: #1a232b; --chrome-tab: #222d36; --surface: #151d24; --surface-2: #1b252d;
    --line: #2b3843; --line-soft: #222d36; --fg: #e3eaf0; --muted: #9aa9b5; --faint: #6d7c88;
    --accent: #3fb6d3; --accent-soft: #143845; --accent-fg: #071a21; --sel: #16323d;
    --env-prod: #ef6a5f; --env-stage: #e0a748; --env-dev: #6f9df0; --env-local: #8e9ca8;
    --edit-bg: #3d3112; --edit-fg: #f3cf75; --add-bg: #15361f; --add-fg: #86d79c; --del-bg: #43201d; --del-fg: #f39a91;
    --kw: #d08cf2; --str: #7fd3a4; --num: #f0a45d; --bar: #3fb6d3; --bar-track: #26323c; --curcol: #18272f; --shadow: 0 10px 30px rgba(0,0,0,.45);
    --check-a: #2a333b; --check-b: #1f272e; --site-bg: #14181a; --site-fg: #e6ebe8; --site-muted: #98a59f; --site-line: #2a3133;
    --site-link: #7fb2f0; --site-brand: #3aa58a; --site-brand-fg: #08130f; --native-bg: #0e0e0e; --native-fg: #b5b5b5; --video-bg: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --chrome: #1a232b; --chrome-tab: #222d36; --surface: #151d24; --surface-2: #1b252d;
  --line: #2b3843; --line-soft: #222d36; --fg: #e3eaf0; --muted: #9aa9b5; --faint: #6d7c88;
  --accent: #3fb6d3; --accent-soft: #143845; --accent-fg: #071a21; --sel: #16323d;
  --env-prod: #ef6a5f; --env-stage: #e0a748; --env-dev: #6f9df0; --env-local: #8e9ca8;
  --edit-bg: #3d3112; --edit-fg: #f3cf75; --add-bg: #15361f; --add-fg: #86d79c; --del-bg: #43201d; --del-fg: #f39a91;
  --kw: #d08cf2; --str: #7fd3a4; --num: #f0a45d; --bar: #3fb6d3; --bar-track: #26323c; --curcol: #18272f; --shadow: 0 10px 30px rgba(0,0,0,.45);
    --check-a: #2a333b; --check-b: #1f272e; --site-bg: #14181a; --site-fg: #e6ebe8; --site-muted: #98a59f; --site-line: #2a3133;
    --site-link: #7fb2f0; --site-brand: #3aa58a; --site-brand-fg: #08130f; --native-bg: #0e0e0e; --native-fg: #b5b5b5; --video-bg: #000000;
  color-scheme: dark;
}

html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--font-mono); }

/* ---------- browser frame ---------- */
.browser {
  height: 100%; display: flex; flex-direction: column; border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow);
}
.tabstrip { display: flex; align-items: flex-end; gap: 2px; background: var(--chrome); padding: 8px 8px 0; overflow-x: auto; flex: none; }
.dots { display: flex; gap: 6px; padding: 0 10px 10px 4px; flex: none; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.ctab {
  display: flex; align-items: center; gap: 7px; padding: 7px 12px; border: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--muted); white-space: nowrap; font-size: 12px; flex: none;
}
.ctab:hover { background: color-mix(in srgb, var(--chrome-tab) 55%, transparent); }
.ctab[aria-selected="true"] { background: var(--chrome-tab); color: var(--fg); }
.ctab { cursor: pointer; }
.ctab .ico { width: 13px; height: 13px; }
.ctab .cx { color: var(--faint); border-radius: 3px; padding: 0 3px; line-height: 1; margin-left: 2px; }
.ctab .cx:hover { background: var(--line); color: var(--fg); }
.envdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.toolbar { display: flex; align-items: center; gap: 8px; background: var(--chrome-tab); padding: 6px 10px; border-bottom: 1px solid var(--line); flex: none; position: relative; }
.omnibox { flex: 1; min-width: 0; background: var(--surface-2); border-radius: 14px; padding: 5px 12px; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.omnibox b { color: var(--fg); font-weight: 500; }
.ext-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.ext-btn svg { display: block; }
/* ---------- app ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; position: relative; }
.apphead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; border-top: 3px solid var(--envc, var(--env-local)); }
.apphead .name { font-weight: 600; font-size: 14px; }
.badge { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; color: #fff; background: var(--envc); }
.pill { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pill b { color: var(--fg); font-weight: 500; }
.spacer { flex: 1; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.warn { background: var(--env-stage); border-color: var(--env-stage); color: #fff; font-weight: 600; }
.btn.danger { background: var(--env-prod); border-color: var(--env-prod); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
.btn.primary kbd { color: inherit; border-color: color-mix(in srgb, var(--accent-fg) 40%, transparent); background: transparent; }

.body { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 0; }
.body.home { grid-template-columns: minmax(0, 1fr); }
.body.home .side { display: none; }
.side { border-right: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; min-height: 0; }
.side .search { margin: 8px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.tree { overflow: auto; padding: 0 6px 10px; flex: 1; }
.grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 10px 8px 4px; display: flex; justify-content: space-between; }
.node { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: none; padding: 4px 8px; border-radius: 5px; text-align: left; color: var(--fg); }
.node:hover { background: var(--line-soft); }
.node.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.node.dim { color: var(--faint); cursor: default; }
.node .meta { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.ico { width: 14px; height: 14px; flex: none; color: var(--faint); }
.node.active .ico { color: var(--accent); }

.work { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.wtabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surface-2); overflow-x: auto; flex: none; }
.wtab { display: flex; align-items: center; gap: 6px; border: 0; border-right: 1px solid var(--line-soft); background: none; padding: 7px 10px 7px 12px; color: var(--muted); white-space: nowrap; font-size: 12.5px; }
.wtab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 0 2px 0 var(--accent); }
.wtab .x { border: 0; background: none; color: var(--faint); padding: 0 2px; border-radius: 3px; line-height: 1; }
.wtab .x:hover { background: var(--line); color: var(--fg); }
.wtab.add { color: var(--faint); padding: 7px 12px; }
.wtab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--edit-fg); }

.bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; font-size: 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.filter { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; background: var(--surface); }
.filter span { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.filter input { flex: 1; min-width: 0; border: 0; background: none; padding: 4px 0; font-family: var(--font-mono); font-size: 12px; outline: none; }
.caption { color: var(--faint); font-size: 11.5px; }

.gridwrap { flex: 1; overflow: auto; min-height: 140px; }
table.grid { border-collapse: separate; border-spacing: 0; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 100%; }
.grid th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); text-align: left; font-weight: 600; padding: 5px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-soft); white-space: nowrap; font-family: var(--font-ui); font-size: 12px; }
.grid th small { color: var(--faint); font-weight: 400; font-family: var(--font-mono); font-size: 10.5px; margin-left: 4px; }
.grid td { padding: 4px 10px; border-bottom: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.grid td.rn, .grid th.rn { color: var(--faint); text-align: right; width: 1%; background: var(--surface-2); position: sticky; left: 0; }
.grid th.rn { z-index: 2; }
.grid tr:hover td { background: color-mix(in srgb, var(--sel) 50%, transparent); }
.grid tr.sel td { background: var(--sel); }
.grid td.null { color: var(--faint); font-style: italic; }
.grid td.num { text-align: right; }
.grid td.edit { background: var(--edit-bg) !important; color: var(--edit-fg); font-weight: 500; }
.grid tr.add td { background: var(--add-bg); color: var(--add-fg); }
.grid tr.del td { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; }
.grid td.ro { color: var(--muted); }
.grid td input { width: 100%; min-width: 80px; font: inherit; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; background: var(--surface); outline: none; }

.foot { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; flex: none; font-size: 12px; }
.pending { display: flex; align-items: center; gap: 8px; background: var(--edit-bg); color: var(--edit-fg); border-radius: 6px; padding: 3px 4px 3px 10px; font-weight: 500; flex-wrap: wrap; }
.pending .btn { padding: 2px 8px; }
.foot .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

.status { display: flex; align-items: center; gap: 14px; padding: 4px 12px; border-top: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 11.5px; flex-wrap: wrap; }
.ok { color: var(--add-fg); }
.status .spacer { flex: 1; }

/* structure */
.scroll { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.scroll h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
pre.code { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; background: var(--surface-2); border-radius: 8px; overflow: auto; white-space: pre; }
.kw { color: var(--kw); font-weight: 600; }
.s { color: var(--str); }
.n { color: var(--num); }
.k { color: var(--accent); }
.tag { display: inline-block; font-family: var(--font-ui); font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; font-weight: 600; }

/* editor */
.editor { display: flex; flex-direction: column; border-bottom: 1px solid var(--line); flex: none; }
.editor textarea { width: 100%; min-height: 150px; resize: vertical; border: 0; padding: 12px 14px; background: var(--surface); font-family: var(--font-mono); font-size: 13px; line-height: 1.6; outline: none; tab-size: 2; }
.edbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--surface-2); border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.est { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.est b { color: var(--fg); font-variant-numeric: tabular-nums; }
.est.over b { color: var(--env-stage); }
.banner { margin: 10px; padding: 8px 12px; border-radius: 6px; font-size: 12px; background: var(--edit-bg); color: var(--edit-fg); }
.empty { padding: 30px; color: var(--faint); text-align: center; }
.jobs { padding: 0 10px 12px; }
.jobs h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* redis */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(240px, 40%) minmax(0, 1fr); }
.split > div { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.split > div + div { border-left: 1px solid var(--line); }
.vhead { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.vhead .k { font-family: var(--font-mono); font-weight: 600; color: var(--fg); }
.type { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.docs { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.doc { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.55; white-space: pre; overflow-x: auto; background: var(--surface); }

/* install card */
.install { margin: auto; max-width: 460px; padding: 26px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 12px; }
.install h2 { margin: 0; font-size: 17px; text-wrap: balance; }
.install p { margin: 0; color: var(--muted); line-height: 1.5; }
.install code { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); padding: 6px 9px; border-radius: 6px; display: block; overflow-x: auto; white-space: nowrap; }

/* overlays */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 20; display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.drawer header h3 { margin: 0; font-size: 14px; }
.drawer .scroll { padding: 14px; }
.drawer footer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); justify-content: flex-end; flex-wrap: wrap; }
.scrim { position: absolute; inset: 0; overflow: auto; background: rgba(10, 18, 24, .35); z-index: 30; display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px 16px; }
.modal { width: min(460px, 100%); background: var(--surface); border-radius: 10px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; font-size: 15px; }
.modal p { margin: 0; color: var(--muted); line-height: 1.5; }
.modal input:not([type="radio"]) { border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-family: var(--font-mono); background: var(--surface-2); }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; }
.palette { width: min(520px, 100%); background: var(--surface); border-radius: 10px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; font-size: 14px; background: none; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 300px; overflow: auto; }
.palette li { padding: 7px 10px; border-radius: 6px; display: flex; gap: 8px; cursor: pointer; }
.palette li.on, .palette li:hover { background: var(--accent-soft); color: var(--accent); }
.palette li small { margin-left: auto; color: var(--faint); }
.toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--fg); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 12.5px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- home (start screen inside the app tab) ---------- */
.homewrap { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.hsec { min-width: 0; }
.hsec h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.hhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.hhead .search { flex: 1; min-width: 150px; max-width: 320px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.hhead .caption { margin-left: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(210px, 100%), 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; min-width: 0; border: 1px solid var(--line); border-left: 3px solid var(--envc, var(--line)); border-radius: 8px; background: var(--surface); padding: 10px 12px; }
.card:hover { background: var(--surface-2); }
.card:disabled { cursor: not-allowed; opacity: .6; border-left-color: var(--line); }
.card:disabled:hover { background: var(--surface); }
.ctop { display: flex; align-items: center; gap: 7px; width: 100%; min-width: 0; }
.ctop b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

// ---------------------------------------------------------------- grid models
// rawModel(target) gives {cols, types, rows:[{pk, cells}], editable:Set, pkCol} straight from the "database".
function rawModel(target) {
  const c = C();
  if (c.kind === 'relational') {
    const t = c.tables[target];
    const pki = t.cols.findIndex(x => x.pk);
    return { cols: t.cols.map(x => x.name), types: t.cols.map(x => x.type), pkCol: t.cols[pki].name,
      rows: t.rows.map(r => ({ pk: String(r[pki]), cells: r })), editable: new Set(t.cols.filter(x => !x.pk).map(x => x.name)) };
  }
  if (c.kind === 'keyvalue') {
    const k = c.keys.find(x => x.key === target);
    if (k.type === 'hash') return { cols: ['field', 'value'], types: ['', ''], rows: Object.entries(k.value).map(([f, v]) => ({ pk: f, cells: [f, v] })), editable: new Set(['value']) };
    if (k.type === 'zset') return { cols: ['member', 'score'], types: ['', 'number'], rows: k.value.map(([m, s]) => ({ pk: m, cells: [m, s] })), editable: new Set(['score']) };
    if (k.type === 'list') return { cols: ['index', 'value'], types: ['number', ''], rows: k.value.map((v, i) => ({ pk: String(i), cells: [i, v] })), editable: new Set(['value']) };
    return { cols: ['value'], types: [''], rows: [{ pk: 'value', cells: [k.value] }], editable: new Set(['value']) };
  }
}
const isNum = t => /int|numeric|number|real|double|float|decimal/i.test(t || '');

// ---------------------------------------------------------------- change set
function recordEdit(target, pk, col, value) {
  const ch = P().changes;
  const ins = ch.find(x => x.type === 'insert' && x.target === target && x.tmp === pk);
  if (ins) { ins.values[col] = value; return; }
  const m = rawModel(target);
  const orig = m.rows.find(r => r.pk === pk).cells[m.cols.indexOf(col)];
  const i = ch.findIndex(x => x.type === 'update' && x.target === target && x.pk === pk && x.col === col);
  if (String(orig ?? 'NULL') === value) { if (i >= 0) ch.splice(i, 1); return; }
  if (i >= 0) ch[i].value = value; else ch.push({ type: 'update', target, pk, col, old: orig, value });
}
function lit(v, type) {

  if (isNum(type) && /^-?\d+(\.\d+)?$/.test(String(v))) return `<span class="n">${esc(v)}</span>`;
  return `<span class="s">'${esc(String(v).replace(/'/g, "''"))}'</span>`;
}
function statementFor(ch) {
  const c = C();
  const K = w => `<span class="kw">${w}</span>`;
  if (c.kind === 'relational') {
    const t = c.tables[ch.target];
    const type = n => (t.cols.find(x => x.name === n) || {}).type;
    const pkc = t.cols.find(x => x.pk);
    if (ch.type === 'update') return `${K('UPDATE')} "${ch.target}" ${K('SET')} "${ch.col}" = ${lit(ch.value, type(ch.col))} ${K('WHERE')} "${pkc.name}" = ${lit(ch.pk, pkc.type)};`;
    if (ch.type === 'delete') return `${K('DELETE FROM')} "${ch.target}" ${K('WHERE')} "${pkc.name}" = ${lit(ch.pk, pkc.type)};`;
    const cols = Object.keys(ch.values).filter(k => ch.values[k] !== '');
    if (!cols.length) return `${K('INSERT INTO')} "${ch.target}" ${K('DEFAULT VALUES')};`;
    return `${K('INSERT INTO')} "${ch.target}" (${cols.map(x => `"${x}"`).join(', ')})\n  ${K('VALUES')} (${cols.map(x => lit(ch.values[x], type(x))).join(', ')})${S.conn === 'pg' ? ' ' + K('RETURNING') + ' "' + pkc.name + '"' : ''};`;
  }
  const k = c.keys.find(x => x.key === ch.target);
  const q = s => `<span class="s">"${esc(s)}"</span>`;
  if (k.type === 'hash') return `${K('HSET')} ${esc(ch.target)} ${q(ch.pk)} ${q(ch.value)}`;
  if (k.type === 'zset') return `${K('ZADD')} ${esc(ch.target)} <span class="n">${esc(ch.value)}</span> ${q(ch.pk)}`;
  if (k.type === 'list') return `${K('LSET')} ${esc(ch.target)} <span class="n">${ch.pk}</span> ${q(ch.value)}`;

}
function changeScript() {

function applyChanges() {
  const c = C(), n = P().changes.length;
  for (const ch of P().changes) {
    if (c.kind === 'relational') {
      const t = c.tables[ch.target], pki = t.cols.findIndex(x => x.pk);
      if (ch.type === 'update') { const r = t.rows.find(r => String(r[pki]) === ch.pk); r[t.cols.findIndex(x => x.name === ch.col)] = ch.value === 'NULL' ? null : ch.value; }

    } else {
      const k = c.keys.find(x => x.key === ch.target);
      if (k.type === 'hash') k.value[ch.pk] = ch.value;
      else if (k.type === 'zset') k.value.find(x => x[0] === ch.pk)[1] = +ch.value;

}

  if (C().kind === 'file') { toast('No edits in this sheet. ⌘S writes the file back with COPY … TO and asks before overwriting.'); return; }

// SQL-ish row filter: col op value
function parseFilter(text, m) {
  const t = text.trim();
  if (!t) return null;
  const mt = t.match(/^(\w+)\s*(=|!=|<>|>=|<=|>|<|like|ilike)\s*(.+)$/i);
  if (!mt) return { error: 'Use the form column = value, e.g. status = \'paid\'' };
  const [, col, opRaw, rawVal] = mt;
  const i = m.cols.indexOf(col);
  if (i < 0) return { error: `No column named ${col}` };
  const op = opRaw.toLowerCase(), val = rawVal.trim().replace(/^'(.*)'$/, '$1');
  return { fn: r => {
    const v = r.cells[i]; if (v === null) return /^null$/i.test(val) && (op === '=');
    const a = isNaN(+v) || isNaN(+val) ? String(v) : +v, b = isNaN(+v) || isNaN(+val) ? val : +val;
    switch (op) {
      case '=': return a == b; case '!=': case '<>': return a != b; case '>': return a > b; case '<': return a < b;
      case '>=': return a >= b; case '<=': return a <= b;
      default: return new RegExp('^' + val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*') + '$', op === 'ilike' ? 'i' : '').test(String(v));
    }
  } };
}
// SQL WHERE for file sheets: comparisons joined with AND
function whereFn(text, cols) {
  const parts = text.trim().split(/\s+and\s+/i), m = { cols };
  const fns = [];
  for (const p of parts) {
    const f = parseFilter(p, m);
    if (!f) continue;
    if (f.error) return { error: f.error + '. Join conditions with AND, e.g. total > 100 AND country = \'DE\'' };
    fns.push(f.fn);
  }
  return { fn: r => fns.every(fn => fn({ cells: r })) };
}

function runRelQuery(sql) {
  const c = C();
  if (duckBrowser() && /^\s*(insert|update|delete|create|drop|alter|copy)\b/i.test(sql))
    return { error: true, message: 'Cannot execute statement in read-only mode: analytics.duckdb is attached READ_ONLY in the browser. Switch the DuckDB engine to Runner for read-write.' };
  if (S.conn === 'pg' && /group\s+by\s+status/i.test(sql) && /from\s+orders/i.test(sql)) {
    const agg = {};
    c.tables.orders.rows.forEach(r => { const a = agg[r[2]] ||= { n: 0, s: 0 }; a.n++; a.s += +(r[3] || 0); });
    return { cols: ['status', 'orders', 'revenue'], types: ['', 'int', 'numeric'], rows: Object.entries(agg).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => [k, v.n, v.s.toFixed(2)]) };
  }
  if (S.conn === 'duck' && /from\s+invoices/i.test(sql) && /group\s+by/i.test(sql)) {
    const agg = {};
    c.tables.invoices.rows.forEach(r => { const month = r[2].slice(0, 7) + '-01'; const a = agg[r[3] + month] ||= { plan: r[3], month, s: 0 }; a.s += +r[4]; });
    return { cols: ['plan', 'month', 'revenue'], types: ['', 'date', 'decimal'], rows: Object.values(agg).sort((a, b) => b.month.localeCompare(a.month) || b.s - a.s).map(a => [a.plan, a.month, a.s.toFixed(2)]) };
  }
  const tm = sql.match(/from\s+"?(\w+)"?/i);
  if (tm && c.tables[tm[1]]) {
    const m = rawModel(tm[1]);
    const w = sql.match(/where\s+(.+?)\s*(;|$|order|limit)/is);
    const f = w ? parseFilter(w[1], m) : null;
    const rows = (f && f.fn ? m.rows.filter(f.fn) : m.rows).map(r => r.cells);
    return { cols: m.cols, types: m.types, rows };
  }
  return { message: tm ? `relation "${tm[1]}" does not exist` : 'Statement ran. This mockup only has canned results for SELECTs on the sample tables.', error: !!tm };
}

// ---------------------------------------------------------------- views: BigQuery
function bqEstimate(sql) {
  const c = C(), s = sql.toLowerCase();
  let total = 0, refs = [];
  for (const [name, t] of Object.entries(c.tables)) {
    if (!s.includes(name.toLowerCase())) continue;
    refs.push(name.split('.').pop());
    const colFrac = /select\s+\*/.test(s) ? 1 : Math.max(1, t.cols.filter(([n]) => new RegExp('\\b' + n + '\\b').test(s)).length) / t.cols.length;
    let partFrac = 1;
    if (t.days && new RegExp('\\b' + t.cols[0][0] + '\\b\\s*(>=|>|between|=)').test(s)) {
      const d = s.match(/interval\s+(\d+)\s+day/);
      partFrac = Math.min(1, (d ? +d[1] : 30) / t.days);
    }
    total += t.bytes * colFrac * partFrac;
  }
  return { bytes: total, refs };
}

  const e = bqEstimate(sql), lim = C().limitGB * 1e9;
  if (!e.refs.length) return { html: '<span class="est">Dry run: no tables referenced yet</span>', over: false, e };
  const over = e.bytes > lim;
  const usd = e.bytes / 1099511627776 * 6.25;
  return { over, e, html: `<span class="est ${over ? 'over' : ''}" title="jobs.query with dryRun: true">Dry run: this query will process <b>${fmtBytes(e.bytes)}</b> · ≈ $${usd < 0.01 ? '<0.01' : usd.toFixed(2)} on demand</span>` };
}

// ---------------------------------------------------------------- views: file sheets (VisiData-style)
const csvCols = () => C().cols.map(x => x.name);
function sheetVisible(sh) {
  let rows = sh.rows, err = null;
  if (sh.where && sh.where.trim()) {
    const f = whereFn(sh.where, csvCols());
    if (f.error) err = f.error; else rows = rows.filter(f.fn);
  }
  if (sh.sort) {
    const i = csvCols().indexOf(sh.sort.col), d = sh.sort.dir === 'asc' ? 1 : -1;
    rows = rows.slice().sort((a, b) => {
      const x = a[i], y = b[i];
      if (x === null) return 1; if (y === null) return -1;
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * d;
    });
  }
  return { rows, err };
}
function freqOf(sh) {
  const src = sheetVisible(sh.src).rows, i = csvCols().indexOf(sh.col), counts = new Map();
  src.forEach(r => { const v = r[i] === null ? null : r[i]; counts.set(v, (counts.get(v) || 0) + 1); });
  return { total: src.length, items: [...counts.entries()].sort((a, b) => b[1] - a[1]) };
}
function summaryOf(sh) {
  const rows = sheetVisible(sh.src).rows;
  return C().cols.map((c, i) => {
    const vals = rows.map(r => r[i]), nn = vals.filter(v => v !== null);
    const num = isNum(c.type) && !/(^|_)id$|_no$/.test(c.name);
    const counts = new Map(); nn.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
    const distinct = counts.size, unique = distinct === nn.length && nn.length > 5;
    const sorted = nn.slice().sort((a, b) => typeof a === 'number' ? a - b : String(a).localeCompare(String(b)));
    const top = unique || !counts.size ? '—' : [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
    return [c.name, c.type, fmtN((vals.length - nn.length) * sheetScale()), unique ? '≈ ' + fmtN(nn.length * sheetScale()) : String(distinct),
      sorted.length ? String(sorted[0]) : null, sorted.length ? String(sorted[sorted.length - 1]) : null,
      num && nn.length ? (nn.reduce((a, b) => a + b, 0) / nn.length).toFixed(2) : null,
      top === '—' ? '—' : `${top[0]} (${fmtN(top[1] * sheetScale())})`];
  });
}
// Parquet over HTTP: DuckDB reads the footer, then only the columns and row groups a step needs.
function touchUrlFile(what, cols, groups) {
  const c = C();
  if (!c.src) return;
  if (/parquet/i.test(c.fmt)) c.loadNote = `${what}: read footer · ${cols.length} of ${c.cols.length} column${c.cols.length > 1 ? 's' : ''} · ${groups} of 412 row groups via range requests · ${(cols.length / c.cols.length * groups / 412 * 3400).toFixed(groups < 50 ? 1 : 0)} MB of 3.4 GB fetched`;
  else c.loadNote = `${what}: streamed ${c.name} again through DuckDB (${c.size}) · a URL can't be indexed, so each step re-reads it`;
}
function sortNote(col) {
  const c = C();
  if (c.src) { touchUrlFile(`Sort on ${col}`, [col], 412); return /parquet/i.test(c.fmt) ? 'read one column over HTTP range requests' : `re-streamed ${c.size} from ${c.host}`; }
  return 're-scanned 1.2 GB in 3.4 s (view over file)';
}
function curSheet() { const t = tab(); return t.stack ? t.stack[t.stack.length - 1] : null; }
function pushFreq() {
  const t = tab(), sh = curSheet();
  if (!sh) return;
  if (sh.type !== 'rows') { toast('Frequency works on a rows sheet. Press Esc to go back.'); return; }
  t.stack.push({ type: 'freq', title: sh.cur + ' frequency', col: sh.cur, src: sh, sel: 0 });
  touchUrlFile(`Frequency of ${sh.cur}`, [sh.cur], 412);
  renderWork();
}
function pushSummary() {
  const t = tab(), sh = curSheet();
  if (!sh) return;
  if (sh.type !== 'rows') { toast('Column summary works on a rows sheet. Press Esc to go back.'); return; }
  t.stack.push({ type: 'summary', title: 'column summary', src: sh });
  toast('SUMMARIZE ran over the sheet');
  renderWork();
}
function pickFreq(idx) {
  const t = tab(), sh = curSheet();
  if (!sh || sh.type !== 'freq') return;
  const item = freqOf(sh).items[idx];
  if (!item) return;
  const i = csvCols().indexOf(sh.col), val = item[0];
  const rows = sheetVisible(sh.src).rows.filter(r => r[i] === val);
  t.stack.push({ type: 'rows', title: `${sh.col} = ${val === null ? 'NULL' : val}`, rows, where: '', sort: sh.src.sort, cur: sh.src.cur });
  renderWork();
}
function popSheet() {
  const t = tab();
  if (!t.stack || t.stack.length < 2) return false;
  t.stack.pop(); renderWork(); return true;
}
function viewSheet(t) {
  const st = t.stack, sh = st[st.length - 1], c = C();
  const crumbs = `<nav class="crumbs" aria-label="Sheet stack">${st.map((s, i) => `<button data-crumb="${i}" aria-current="${i === st.length - 1}">${esc(s.title)}</button>`).join('<span class="sep">›</span>')}</nav>`;
  const back = st.length > 1 ? '<button class="btn" data-act="sheetback">Back <kbd>esc</kbd></button>' : '';
  const note = c.src ? `<div class="stream"><span class="ok">●</span><span style="overflow-wrap:anywhere;min-width:0">${esc(c.loadNote)}</span></div>` : '';
  if (sh.type === 'freq') {
    const f = freqOf(sh), max = f.items.length ? f.items[0][1] : 1;
    const rows = f.items.map(([v, n], i) => `<tr class="pick${i === sh.sel ? ' sel' : ''}" data-fval="${i}"><td class="rn">${i + 1}</td><td class="${v === null ? 'null' : ''}">${esc(v ?? 'NULL')}</td><td class="num">${fmtN(n * sheetScale())}</td><td class="num">${(n / f.total * 100).toFixed(1)}%</td><td><div class="fbar"><i style="width:${(n / max * 100).toFixed(1)}%"></i></div></td></tr>`).join('');
    return `<div class="bar">${crumbs}${back}</div>${note}
      <div class="gridwrap"><table class="grid"><thead><tr><th class="rn">#</th><th>${esc(sh.col)}</th><th>count</th><th>%</th><th style="width:40%"></th></tr></thead><tbody>${rows || '<tr><td class="rn"></td><td colspan="4" class="null">No values</td></tr>'}</tbody></table></div>
      <div class="foot"><span class="caption">Enter or click: filter source · Esc: back · ⌘⇧F: frequency · ⌘I: summary</span><span class="count">${f.items.length} values · ${fmtN(f.total * sheetScale())} rows</span></div>`;
  }
  if (sh.type === 'summary') {
    return `<div class="bar">${crumbs}${back}</div>
      <div class="gridwrap">${readonlyGrid(['column', 'type', 'nulls', 'distinct', 'min', 'max', 'mean', 'top value'], summaryOf(sh), ['', '', 'int', 'int', '', '', 'double', ''])}</div>
      <div class="foot"><span class="caption">DuckDB SUMMARIZE over the parent sheet · Esc: back</span><span class="count">${c.cols.length} columns</span></div>`;
  }
  const v = sheetVisible(sh);
  const head = c.cols.map(col => {
    const arrow = sh.sort && sh.sort.col === col.name ? `<span class="arrow">${sh.sort.dir === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th class="sortable${col.name === sh.cur ? ' cur' : ''}" data-sort="${esc(col.name)}" title="Click to sort">${esc(col.name)}<small>${esc(col.type)}</small>${arrow}</th>`;
  }).join('');
  const body = v.rows.map((r, n) => `<tr><td class="rn">${n + 1}</td>${r.map((x, i) => {
    const col = c.cols[i];
    return `<td class="${x === null ? 'null' : ''} ${isNum(col.type) ? 'num' : ''}${col.name === sh.cur ? ' cur' : ''}" data-cur="${esc(col.name)}">${esc(x ?? 'NULL')}</td>`;
  }).join('')}</tr>`).join('');
  const total = sh.where && !v.err ? v.rows.length * sheetScale() : sh.rows.length * sheetScale();
  return `<div class="bar">${crumbs}${back}</div>
    ${c.src ? `<div class="stream" id="loadNote"><span class="ok">●</span><span style="overflow-wrap:anywhere;min-width:0">${esc(c.loadNote)}</span></div>` : ''}
    <div class="bar">
      <label class="filter"><span>WHERE</span><input id="where-${st.length}" data-sheetwhere value="${esc(sh.where)}" placeholder="total > 100 AND country = 'DE'   (Enter to apply)"></label>
      <button class="btn" data-act="freq" title="Frequency of the current column">Frequency · ${esc(sh.cur)} <kbd>⌘⇧F</kbd></button>
      <button class="btn" data-act="summary" title="Column summary">Summary <kbd>⌘I</kbd></button>
    </div>
    ${v.err ? `<div class="banner">${esc(v.err)}</div>` : ''}
    <div class="gridwrap"><table class="grid"><thead><tr><th class="rn">#</th>${head}</tr></thead><tbody>${body || `<tr><td class="rn"></td><td colspan="${c.cols.length}" class="null">No rows match</td></tr>`}</tbody></table></div>
    <div class="foot"><span class="caption">Click a header to sort · click a cell to pick the column · ⌘⇧F: frequency · ⌘I: summary${st.length > 1 ? ' · Esc: back' : ''}</span>
      <span class="count">1–${v.rows.length} of ${fmtN(total)} rows</span></div>`;
}

    t.result = { error: true, message: 'Code: 164. DB::Exception: reader: Cannot execute query in readonly mode. (READONLY). Turn off Read-only in the header to send writes.' };
    renderWork(); return;
  }
  const res = chResult(t.sql), big = res.total > 2000;
  const s = { qid: uuid(), pages: 0, rows: 0, target: res.total, res, started: Date.now() };
  t.stream = s; t.result = null;
  S.running = t.id; S.runConn = 'ch'; renderWork(); renderOverlay();
  runTimer = setInterval(() => {
    s.pages++;
    s.rows = big ? Math.min(res.total, s.pages * 2000) : res.total;
    if (s.rows >= res.total) {
      clearInterval(runTimer);
      const ms = Date.now() - s.started + 300;
      t.result = { cols: res.cols, types: res.types, rows: res.rows, total: res.total, read: res.read, ms };
      t.stream = null; S.running = null; S.runConn = null;
      PER.ch.last = ms + ' ms';
      PER.ch.history.unshift([s.qid.slice(0, 8), new Date().toTimeString().slice(0, 5), res.read.split(', ')[0].replace(' rows', ''), res.read.split(', ')[1], (ms / 1000).toFixed(1) + ' s']);
      render();
    } else if (S.conn === 'ch' && PER.ch.active === t.id) renderWork();
  }, 420);
}
function stop() {
  if (!runningHere()) return;
  const p = PER[S.runConn], t = p.tabs.find(x => x.id === S.running);
  if (t && t.type === 'chq') {
    clearInterval(runTimer);
    const s = t.stream;
    t.result = { message: `Stopped: aborted the fetch, then sent KILL QUERY WHERE query_id = '${s.qid}' on a second request so the server stops too. Kept the ${fmtN(s.rows)} rows already received.`,
      cols: s.res.cols, types: s.res.types, rows: s.res.rows.slice(0, Math.min(s.res.rows.length, s.pages * 2)), total: s.rows, partial: true, ms: Date.now() - s.started };
    t.stream = null;
  } else {
    clearTimeout(runTimer);
    const how = S.runConn === 'sqlite' ? 'sqlite3_interrupt' : S.runConn === 'duck' ? (PER.duck.engine === 'browser' ? 'interrupt sent to the DuckDB-WASM worker' : 'duckdb_interrupt') : 'PQcancel';
    if (t) t.result = { message: t.type === 'bq' ? 'Job cancelled (jobs.cancel). You are billed only for bytes already scanned.' : `Query cancelled (${how}).` };
  }
  S.running = null; S.runConn = null; render();
}

// ---------------------------------------------------------------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-closeconn],[data-conn],[data-act],[data-tab],[data-close],[data-open],[data-view],[data-key],[data-row],[data-pal],[data-recent],[data-sort],[data-cur],[data-fval],[data-crumb]');
  if (!el) return;
  if (el.dataset.closeconn) {
    e.stopPropagation(); const id = el.dataset.closeconn;
    if (isXT(id)) pauseVid();
    S.open = S.open.filter(x => x !== id);
    if (S.conn === id) S.conn = 'home';
    S.drawer = false; render(); return;
  }
  if (el.dataset.close) {
    e.stopPropagation(); const p = P(); const i = p.tabs.findIndex(x => x.id === el.dataset.close);
    p.tabs.splice(i, 1); if (p.active === el.dataset.close) p.active = p.tabs[Math.max(0, i - 1)].id; render(); return;
  }
  if (el.dataset.conn) { openConn(el.dataset.conn); render(); return; }
  if (el.dataset.recent !== undefined) { recentFile(RECENT[+el.dataset.recent]); render(); return; }
  if (el.dataset.tab) { P().active = el.dataset.tab; render(); return; }
  if (el.dataset.pal !== undefined) { runPal(+el.dataset.pal); return; }
  if (el.dataset.view) { tab().view = el.dataset.view; renderWork(); return; }
  if (el.dataset.key) { tab().key = el.dataset.key; renderWork(); return; }
  if (el.dataset.row) { const t = tab(); if (t.type === 'table') { t.sel = el.dataset.row; el.closest('tbody').querySelectorAll('tr').forEach(r => r.classList.toggle('sel', r === el)); } return; }
  if (el.dataset.sort) {
    const sh = curSheet(), col = el.dataset.sort;
    if (!sh) return;
    const prev = sh.sort && sh.sort.col === col ? sh.sort.dir : null;
    sh.sort = prev === null ? { col, dir: 'asc' } : prev === 'asc' ? { col, dir: 'desc' } : null;
    sh.cur = col;
    toast(sh.sort ? `Sorted by ${col} ${sh.sort.dir === 'asc' ? '▲' : '▼'} · ${sortNote(col)}` : `Sort on ${col} cleared`);
    renderWork(); renderTree(); return;
  }
  if (el.dataset.cur) { const sh = curSheet(); if (sh) { sh.cur = el.dataset.cur; renderWork(); renderTree(); } return; }
  if (el.dataset.fval !== undefined) { pickFreq(+el.dataset.fval); return; }
  if (el.dataset.crumb !== undefined) { const t = tab(); t.stack.length = +el.dataset.crumb + 1; renderWork(); return; }
  if (el.dataset.open) {
    const o = el.dataset.open;
    if (o === 'viewobj') { toast('Views, functions and dictionaries open their definition here (not in this mockup).'); return; }
    if (o === 'pattern') { tab().pattern = el.dataset.target; render(); return; }
    if (o === 'col') { const sh = curSheet(); if (sh && sh.type === 'rows') { sh.cur = el.dataset.target; renderWork(); renderTree(); } else toast('Go back to a rows sheet to pick a column'); return; }
    if (o === 'sheetroot') { const t = tab(); t.stack.length = 1; renderWork(); renderTree(); return; }
    openObj(o, el.dataset.target); render(); return;
  }
  const act = el.dataset.act;
  if (act === 'closeoverlay') { if (e.target === el || el.tagName === 'BUTTON') closeOverlay(); return; }
  if (previewAct(act, el)) return;
  if (act === 'okoverlay') { const o = S.overlay; o.onOk(); return; }
  if (act === 'focusapp') { openConn('home'); S.homeView = 'home'; render(); toast('Opens or focuses the dbui tab (action.onClicked, no popup)'); return; }
  if (act === 'openfile') openFile();
  if (act === 'newconn') toast('Connection sheet: pick a driver, fill in host or file, Test connection, env tag and colour.');
  if (act === 'connsettings') { S.overlay = { kind: 'auth' }; renderOverlay(); }
  if (act === 'duckengine') { toggleDuckEngine(); render(); }
  if (act === 'freq') pushFreq();
  if (act === 'summary') pushSummary();
  if (act === 'sheetback') popSheet();
  if (act === 'review') { S.drawer = true; renderOverlay(); }
  if (act === 'closedrawer') { S.drawer = false; renderOverlay(); }
  if (act === 'commit') commit();
  if (act === 'discard') { const n = P().changes.length; P().changes = []; S.drawer = false; if (n) toast(`Discarded ${n} change${n > 1 ? 's' : ''}`); render(); }
  if (act === 'addrow') {
    if (P().readOnly) { toast(roMsg()); return; }
    P().changes.push({ type: 'insert', target: tab().target, tmp: 'new-' + (++insertSeq), values: {} }); render();
    const wrap = document.querySelector('.gridwrap'); if (wrap) wrap.scrollTop = wrap.scrollHeight;
  }
  if (act === 'delrow') {
    const t = tab();
    if (P().readOnly) { toast(roMsg()); return; }
    if (!t.sel) { toast('Click a row first, then press − Row or ⌫'); return; }
    deleteRow(t);
  }
  if (act === 'refresh') { P().last = (20 + Math.round(Math.random() * 40)) + ' ms'; toast('Reloaded rows 1–200'); renderStatus(); }
  if (act === 'run') run();
  if (act === 'stop') stop();
  if (act === 'newquery') { newQuery(); render(); }
  if (act === 'palette') { S.overlay = { kind: 'palette' }; palSel = 0; renderOverlay(); }
  if (act === 'install') toast('Downloading dbui-runner-1.0.3.pkg… macOS Installer opens when it finishes.');
  if (act === 'checkrunner') { S.runner = true; render(); toast('Runner found: dbui-runner 1.0.3'); }
  if (act === 'queryTable') {
    const target = el.dataset.target, isBq = C().wh === 'bq';
    newQuery(); const t = tab(); t.sql = isBq ? `SELECT *\nFROM \`${target}\`\nLIMIT 100` : `SELECT *\nFROM ${target}\nLIMIT 100`; render();
  }
});
// Browser preview actions: returns true when handled.
function previewAct(act, el) {
  const d = el.dataset;
  switch (act) {
    case 'navback': navBack(); return true;
    case 'omni': {
      const o = $('omni');
      if (o.querySelector('input')) return true;
      o.innerHTML = `<input id="omniInput" value="${esc(omniPlain())}" aria-label="Address bar" spellcheck="false" autocomplete="off">`;
      const i = $('omniInput'); i.focus(); i.select(); return true;
    }
    case 'dlshow': showDownloads(); return true;
    case 'dlclose': $('dlbubble').hidden = true; return true;
    case 'settings': openSettings(); render(); return true;
    case 'homeview': S.homeView = 'home'; render(); return true;
    case 'opendemo': openDemo(); render(); return true;
    case 'fileurls': toast('Would open chrome://extensions/?id=dbui, where you turn on “Allow access to file URLs”. Extensions can link there but not flip it.'); return true;
    case 'addexclude': addExclude($('excludeInput') && $('excludeInput').value); return true;
    case 'unexclude': S.preview.excluded = S.preview.excluded.filter(x => x !== d.host); toast(`Removed ${d.host}. Its links follow the rules again.`); rerenderSettings(); return true;
    case 'weblink': followLink(d.link); return true;
    case 'permallow': setPreview(true); return true;
    case 'permdeny': denyPerm(); return true;
    case 'dlopen': { const L = LINKS[S.overlay.link]; S.overlay = null; navigate(S.conn, { page: 'sheet', file: L.file, link: L.id, url: `chrome-extension://dbui/app.html?src=${L.url}` }); toast(`Cancelled Chrome's download and opened ${L.name} in a dbui sheet`); return true; }
    case 'dlkeep': closeOverlay(); return true;
    case 'dlinstead': downloadInstead(); return true;
    case 'neveropen': neverOpen(); return true;
    case 'imgzoom': imgZoom(d.z); return true;
    case 'imgrot': S.img.rot = (S.img.rot + 90) % 360; S.img.px = 0; S.img.py = 0; renderWork(); return true;
    case 'imgpick': S.img.pick = !S.img.pick; renderWork(); return true;
    case 'imgcopy': toast(`Copied ${IMAGES[S.img.i].name} to the clipboard as PNG (navigator.clipboard.write)`); return true;
    case 'imgsave': { const m = $('saveMenu'); if (m) m.hidden = !m.hidden; return true; }
    case 'imgsaveas': { const n = IMAGES[S.img.i].name.replace(/\.\w+$/, '.' + (d.fmt === 'JPEG' ? 'jpg' : d.fmt.toLowerCase())); const m = $('saveMenu'); if (m) m.hidden = true; toast(`Saved ${n}${S.img.rot ? ` (rotated ${S.img.rot}°)` : ''} · canvas.toBlob('image/${d.fmt.toLowerCase()}') → chrome.downloads`); return true; }
    case 'imgstep': imgStep(+d.d); return true;
    case 'vplay': if (S.vid.playing) { pauseVid(); updateVid(); } else playVid(); return true;
    case 'vframe': vidStep(+d.d); return true;
    case 'vab': vidAB(d.ab); return true;
    case 'vpip': toast('Picture in picture: the video floats above other windows (video.requestPictureInPicture)'); return true;
    case 'vshot': toast(`Saved launch-demo-frame-${Math.round(S.vid.t * VID_FPS)}.png · drew the current frame to a canvas`); return true;
    case 'nativeplay': toast("Chrome's built-in player. Turn on Browser preview with .mp4 checked for speed, frame step and A–B loop."); return true;
  }
  return false;
}
function deleteRow(t) {
  const ch = P().changes, pk = t.sel;
  const ins = ch.findIndex(x => x.type === 'insert' && x.tmp === pk);
  if (ins >= 0) ch.splice(ins, 1);
  else {
    const i = ch.findIndex(x => x.type === 'delete' && x.target === t.target && x.pk === pk);
    if (i >= 0) ch.splice(i, 1); else ch.push({ type: 'delete', target: t.target, pk });
  }
  t.sel = null; render();
}

document.addEventListener('dblclick', e => {
  const td = e.target.closest('table.grid[data-editable="1"] td[data-col]');
  if (!td) return;
  const grid = td.closest('table'), target = grid.dataset.target, col = td.dataset.col, pk = td.dataset.pk;
  if (P().readOnly) { toast(roMsg()); return; }
  const m = rawModel(target);
  const isIns = pk.startsWith('new-');
  if (!m.editable.has(col) || (isIns && col === m.pkCol)) { toast(col === m.pkCol ? 'Primary keys are not edited in place' : `${col} is not editable here`); return; }
  if (td.closest('tr').classList.contains('del')) return;
  const cur = td.classList.contains('null') && !isIns ? 'NULL' : td.textContent;
  td.innerHTML = `<input value="${esc(cur)}" aria-label="Edit ${esc(col)}">`;
  const inp = td.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const finish = save => { if (done) return; done = true; if (save && inp.value !== cur) recordEdit(target, pk, col, inp.value); renderWork(); renderOverlay(); };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') finish(true); if (ev.key === 'Escape') { ev.stopPropagation(); finish(false); } });
  inp.addEventListener('blur', () => finish(true));
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-sql]')) {
    const t = tab(); t.sql = e.target.value;
    if (t.type === 'bq') { const est = estimateHTML(t.sql); $('esthere').innerHTML = est.html; $('runwrap').innerHTML = runBtnBq(est); $('bqwarn').innerHTML = est.over ? overBanner(est) : ''; }
  }
  if (e.target.id === 'treeSearch') renderTree();
  if (e.target.id === 'vscrub' && S.vid) { pauseVid(); S.vid.t = +e.target.value; updateVid(); }
  if (e.target.id === 'homeSearch') { S.homeQ = e.target.value; $('homeCards').innerHTML = homeCards(); }
  if (e.target.id === 'palInput') { palSel = 0; renderPalette(e.target.value); }
  if (e.target.id === 'confirmInput') document.querySelector('[data-act="okoverlay"]').disabled = e.target.value !== S.overlay.expect;
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-ro]')) {
    P().readOnly = e.target.checked;
    const c = C();
    if (c.wh === 'ch') { toast(e.target.checked ? 'readonly=1 on: every request carries it and the server refuses writes' : 'readonly=1 off: grid inserts allowed; updates and deletes go through the editor'); renderHead(); renderWork(); }
    else toast(e.target.checked ? `Read-only on: ${c.viaRunner ? 'the runner refuses writes' : c.duck ? 'native DuckDB opens with access_mode READ_ONLY' : 'the worker sets PRAGMA query_only'} for this connection` : 'Read-only off: edits allowed');
  }
  if (e.target.name === 'bqauth') {
    PER.bq.auth = e.target.value; renderHead(); renderStatus();
    toast('Auth method: ' + authOf(e.target.value).label);
  }
  if (e.target.id === 'pvSwitch') {
    if (e.target.checked) { e.target.checked = false; S.overlay = { kind: 'perm' }; renderOverlay(); }
    else setPreview(false);
  }
  if (e.target.matches('[data-ext]')) {
    const x = e.target.dataset.ext;
    if (e.target.checked) S.preview.exts.add(x); else S.preview.exts.delete(x);
    rerenderSettings();
  }
  if (e.target.matches('[data-grpall]')) {
    const g = PV_GROUPS.find(x => x.id === e.target.dataset.grpall);
    g.exts.forEach(x => { if (e.target.checked) S.preview.exts.add(x); else S.preview.exts.delete(x); });
    rerenderSettings();
  }
  if (e.target.id === 'jsonPretty') { curLoc().pretty = e.target.checked; renderWork(); }
  if (e.target.id === 'vspeed' && S.vid) { S.vid.rate = +e.target.value; toast(`Playback speed ${S.vid.rate}×`); }
  if (e.target.id === 'runnerSwitch') {
    S.runner = e.target.checked;
    if (!S.runner && PER.duck.engine === 'runner') { PER.duck.engine = 'browser'; PER.duck.readOnly = true; PER.duck.changes = []; }
    render();
  }
});
// media.html keys: image zoom / step, video play / frame step. Returns true when handled.
function mediaKey(e, mod) {
  const l = curLoc();
  if (l.page !== 'media') return false;
  if (l.kind === 'img') {
    if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); imgZoom('in'); return true; }
    if (mod && (e.key === '-' || e.key === '_')) { e.preventDefault(); imgZoom('out'); return true; }
    if (mod && e.key === '0') { e.preventDefault(); imgZoom('fit'); return true; }
    if (!mod && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); imgStep(e.key === 'ArrowRight' ? 1 : -1); return true; }
  }
  if (l.kind === 'vid' && !mod) {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); if (S.vid.playing) { pauseVid(); updateVid(); } else playVid(); return true; }
    if (e.key === ',' || e.key === '.') { e.preventDefault(); vidStep(e.key === '.' ? 1 : -1); return true; }
  }
  return false;
}
document.addEventListener('focusout', e => { if (e.target.id === 'omniInput') setTimeout(() => { if (!document.activeElement || document.activeElement.id !== 'omniInput') renderChrome(); }, 0); });
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  const typing = e.target.matches('input, textarea, select');
  const fileTab = C().kind === 'file' && !S.overlay;
  if (e.key === 'Enter' && e.target.matches('.ctab, .wtab')) { e.target.click(); return; }
  if (e.target.id === 'omniInput') {
    if (e.key === 'Enter') { e.preventDefault(); typedUrl(e.target.value); }
    if (e.key === 'Escape') { e.preventDefault(); renderChrome(); }
    return;
  }
  if (e.target.id === 'excludeInput' && e.key === 'Enter') { addExclude(e.target.value); return; }
  if (isWebPage() && !S.overlay && !typing && mediaKey(e, mod)) return;
  if (e.target.matches('[data-filter]') && e.key === 'Enter') { tab().filter = e.target.value; renderWork(); return; }
  if (e.target.matches('[data-pattern]') && e.key === 'Enter') { tab().pattern = e.target.value || '*'; render(); return; }
  if (e.target.matches('[data-sheetwhere]') && e.key === 'Enter') { const sh = curSheet(); if (sh) { sh.where = e.target.value; const used = csvCols().filter(n => new RegExp('\\b' + n + '\\b').test(sh.where)); if (sh.where.trim()) touchUrlFile('WHERE ' + sh.where.trim(), used.length ? used : [sh.cur], 37); renderWork(); } return; }
  if (e.target.id === 'palInput') {
    if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palShown.length - 1); renderPalette(e.target.value); e.preventDefault(); }
    if (e.key === 'ArrowUp') { palSel = Math.max(palSel - 1, 0); renderPalette(e.target.value); e.preventDefault(); }
    if (e.key === 'Enter') { runPal(palSel); return; }
  }
  if (e.target.id === 'confirmInput' && e.key === 'Enter' && e.target.value === S.overlay.expect) { S.overlay.onOk(); return; }
  // file sheet navigation (VisiData-style) when not typing
  if (fileTab && !typing && !mod) {
    const sh = curSheet();
    if (sh && sh.type === 'freq' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      const n = freqOf(sh).items.length; sh.sel = Math.max(0, Math.min(n - 1, sh.sel + (e.key === 'ArrowDown' ? 1 : -1))); e.preventDefault(); renderWork(); return;
    }
    if (sh && sh.type === 'freq' && e.key === 'Enter') { e.preventDefault(); pickFreq(sh.sel); return; }
    if (sh && sh.type === 'rows' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      const cols = csvCols(), i = cols.indexOf(sh.cur); sh.cur = cols[Math.max(0, Math.min(cols.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)))]; e.preventDefault(); renderWork(); renderTree(); return;
    }
  }
  if (mod && e.key === 'Enter') { e.preventDefault(); run(); }
  else if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); S.overlay = { kind: 'palette' }; palSel = 0; renderOverlay(); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === 'f' && fileTab) { e.preventDefault(); pushFreq(); }
  else if (mod && !e.shiftKey && e.key.toLowerCase() === 'i' && fileTab) { e.preventDefault(); pushSummary(); }
  else if (mod && e.shiftKey && e.key.toLowerCase() === 'p') { e.preventDefault(); if (!isHome()) { S.drawer = !S.drawer; renderOverlay(); } }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); if (!isHome()) commit(); }
  else if (mod && e.key === '.') { e.preventDefault(); stop(); }
  else if (e.altKey && e.code === 'KeyT') { e.preventDefault(); if (C().kind === 'relational' || C().kind === 'warehouse') { newQuery(); render(); } }
  else if (e.key === 'Escape') {
    if (S.overlay) closeOverlay();
    else if (!$('dlbubble').hidden) $('dlbubble').hidden = true;
    else if (S.drawer) { S.drawer = false; renderOverlay(); }
    else if (C().kind === 'file' && !typing) popSheet();
  }
  else if ((e.key === 'Backspace' || e.key === 'Delete') && !typing && tab().type === 'table' && tab().sel && !P().readOnly) { e.preventDefault(); deleteRow(tab()); }
});

if (/settings/i.test(location.hash)) openSettings();
render();
